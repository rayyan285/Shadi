<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valima Invitation - Bilal & Afrah</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f0f4f8;
            font-family: 'Georgia', serif;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .invitation-container {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 40px 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            box-sizing: border-box;
            border: 1px solid #e1e8ed;
        }
        .arabic-text {
            font-size: 18px;
            color: #555;
            margin-bottom: 25px;
            line-height: 1.6;
        }
        .host-title {
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #777;
            margin-bottom: 10px;
        }
        .hosts-name {
            font-size: 20px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 30px;
        }
        .invite-text {
            font-size: 14px;
            color: #555;
            line-height: 1.5;
            margin-bottom: 25px;
        }
        .couple-heading {
            font-size: 13px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #888;
            margin-bottom: 10px;
        }
        .couple-names {
            font-size: 26px;
            font-family: 'Brush Script MT', cursive, serif;
            color: #b8860b;
            margin-bottom: 30px;
        }
        .date-section {
            border-top: 1px solid #eee;
            border-bottom: 1px solid #eee;
            padding: 20px 0;
            margin: 20px 0;
        }
        .day {
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #555;
        }
        .date {
            font-size: 22px;
            font-weight: bold;
            color: #2c3e50;
            margin-top: 5px;
        }
        .time-section {
            margin-top: 30px;
        }
        .time {
            font-size: 24px;
            font-weight: 300;
            color: #2c3e50;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="invitation-container">
        <!-- Bismillah / Arabic Text -->
        <div class="arabic-text">
            بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ<br>
            بارَكَ اللَّهُ لَكُما وَبارَكَ عَلَيْكُما وَجَمَعَ بَيْنَكُما فِي خَيْرٍ
        </div>

        <!-- Host Details -->
        <div class="host-title">MR. & MRS.</div>
        <div class="hosts-name">TARIQ KHAN</div>
        
        <div class="invite-text">
            request the pleasure of your company<br>at the Valima of their son
        </div>

        <!-- Couple Names -->
        <div class="couple-heading">THE VALIMA OF</div>
        <div class="couple-names">Bilal & Afrah</div>

        <!-- Date Section -->
        <div class="date-section">
            <div class="day">Friday</div>
            <div class="date">8 January 2027</div>
        </div>

        <!-- Time Section -->
        <div class="time-section">
            <div class="time">7:00 PM</div>
        </div>
    </div>

</body>
</html>
